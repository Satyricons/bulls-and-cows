name: Deploy to GitHub Pages

on:
  push:
    branches:
      - bulls-and-cows # Запускать при пуше в нашу ветку

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: . # Папка, которую мы деплоим (корень проекта)
          branch: gh-pages # Ветка, куда будет залит сайт